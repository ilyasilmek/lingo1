name: Skor sunucusu

# Skor tablosu sunucusunu (server/) Cloudflare Workers + D1'e kurar.
# Gerekli repository secrets:
#   CLOUDFLARE_API_TOKEN   Workers ve D1 düzenleme yetkili API anahtarı
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare hesap kimliği
#   LINGO_ADMIN_KEY        (isteğe bağlı) uygunsuz adları gizlemek için yönetici anahtarı

on:
  workflow_dispatch:
    inputs:
      veritabanini_avrupaya_tasi:
        description: 'BOŞ veritabanını silip Doğu Avrupa bölgesinde yeniden kur (içinde kayıt varsa işlem durur)'
        type: boolean
        default: false
  push:
    branches: [main, 'claude/**']
    paths:
      - 'server/**'
      - 'js/game.js'
      - 'js/progress.js'
      - 'js/leaderboard-rules.js'
      - 'data/answers-5.txt'
      - 'data/valid-5.txt'
      - '.github/workflows/skor.yml'

concurrency:
  group: skor-sunucusu
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıklar
        run: npm ci

      - name: Testler
        run: npm test

      - name: Cloudflare bilgileri var mı?
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN ve CLOUDFLARE_ACCOUNT_ID secrets tanımlı değil; kurulum atlandı."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Boş veritabanını Avrupa'ya taşı
        if: steps.check.outputs.ready == 'true' && inputs.veritabanini_avrupaya_tasi
        working-directory: server
        run: |
          set -o pipefail
          OLD_ID=$(npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const db=JSON.parse(s).find(d=>d.name==="lingo-skor");process.stdout.write(db?db.uuid:"")})')
          if [ -z "$OLD_ID" ]; then
            echo "Veritabanı yok, taşınacak bir şey yok."
            exit 0
          fi
          echo "Taşınacak veritabanı: $OLD_ID"
          # Sayım komutu wrangler.toml'daki kimliği kullanır; gerçek kimlik yazılmadan sorgu yanlış veritabanına gider.
          sed -i "s/^database_id = .*/database_id = \"$OLD_ID\"/" wrangler.toml
          set +e
          for i in 1 2 3; do
            npx wrangler d1 execute lingo-skor --remote --json --command "SELECT (SELECT COUNT(*) FROM players) + (SELECT COUNT(*) FROM scores) AS n" > count.json 2> count.err
            rc=$?
            echo "Deneme $i, çıkış kodu $rc"; echo "Ham çıktı:"; cat count.json; echo; cat count.err
            [ $rc -eq 0 ] && break
            sleep 10
          done
          set -e
          if [ $rc -ne 0 ]; then echo "::error::Kayıt sayısı alınamadı, taşıma durduruldu. Hiçbir şey silinmedi."; exit 1; fi
          # Çıktı liste ya da tek nesne olabilir; 'n' değeri nerede olursa bulunur. Bulunamazsa işlem durur.
          N=$(node -e '
            const raw = require("fs").readFileSync("count.json", "utf8");
            const start = raw.search(/[\[{]/);
            const j = JSON.parse(raw.slice(start));
            const find = (x) => {
              if (Array.isArray(x)) { for (const v of x) { const r = find(v); if (r !== undefined) return r; } return undefined; }
              if (x && typeof x === "object") {
                if (typeof x.n === "number") return x.n;
                for (const v of Object.values(x)) { const r = find(v); if (r !== undefined) return r; }
              }
              return undefined;
            };
            const n = find(j);
            if (n === undefined) { console.error("Kayıt sayısı okunamadı"); process.exit(1); }
            process.stdout.write(String(n));
          ')
          echo "Veritabanındaki kayıt sayısı: $N"
          if [ "$N" != "0" ]; then
            echo "::error::Veritabanında $N kayıt var. Veri kaybolmasın diye taşıma durduruldu."
            exit 1
          fi
          npx wrangler d1 delete lingo-skor --skip-confirmation
          echo "Boş veritabanı silindi; aşağıdaki adım Doğu Avrupa'da yenisini kuracak."

      - name: D1 veritabanını bul ya da oluştur
        if: steps.check.outputs.ready == 'true'
        working-directory: server
        run: |
          find_db() {
            npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);const db=j.find(d=>d.name==="lingo-skor");process.stdout.write(db?db.uuid:"")})'
          }
          ID=$(find_db)
          if [ -z "$ID" ]; then
            # Oyuncuların çoğu Türkiye'de: veritabanı Doğu Avrupa'da kurulur.
            npx wrangler d1 create lingo-skor --location eeur
            ID=$(find_db)
          fi
          test -n "$ID"
          echo "Veritabanı: $ID"
          sed -i "s/^database_id = .*/database_id = \"$ID\"/" wrangler.toml

      - name: Veritabanı şemasını uygula
        if: steps.check.outputs.ready == 'true'
        working-directory: server
        run: npx wrangler d1 migrations apply lingo-skor --remote

      - name: Sunucuyu yayınla
        if: steps.check.outputs.ready == 'true'
        working-directory: server
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee deploy.log
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          {
            echo "### Skor sunucusu adresi"
            echo ""
            echo "\`$URL\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Adres: $URL"

      - name: Yönetici anahtarı
        if: steps.check.outputs.ready == 'true'
        working-directory: server
        env:
          ADMIN_KEY: ${{ secrets.LINGO_ADMIN_KEY }}
        run: |
          if [ -n "$ADMIN_KEY" ]; then
            echo "$ADMIN_KEY" | npx wrangler secret put ADMIN_KEY
          else
            echo "LINGO_ADMIN_KEY tanımlı değil, atlandı."
          fi

      - name: Sunucu cevap veriyor mu?
        if: steps.check.outputs.ready == 'true'
        run: |
          URL=https://lingo-skor.stitchilyas.workers.dev
          for i in 1 2 3 4 5; do
            if curl -fsS "$URL/" ; then break; fi
            sleep 5
          done
          echo
          curl -fsS "$URL/v1/tablo?donem=gun" | tee /dev/stderr | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(!Array.isArray(j.entries))process.exit(1);console.log("\nTablo tamam, oyuncu:",j.players)})'
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$URL/v1/skor" -H 'content-type: application/json' -d '{"id":"x"}')
          echo "Geçersiz istek kodu: $code"
          test "$code" = "401"
