<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ff8a4c">
  <meta name="description" content="Türkçe beş harfli kelime tahmin oyunu.">
  <title>Lingo</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preload" href="assets/fonts/inter-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // Tema, ilk boyamadan önce uygulanır (yanıp sönmeyi önler).
    try {
      var t = JSON.parse(localStorage.getItem('lingo:v1') || '{}').theme;
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app" class="app"></div>
  <div id="toasts" class="toast-wrap" role="status" aria-live="polite"></div>
  <noscript>Lingo'yu oynamak için JavaScript gerekli.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
